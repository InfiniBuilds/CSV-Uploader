<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AWS CSV Uploader</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f3f4f6;

        }


        .container {

            width: 500px;

            max-width: 90%;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.12);

            text-align: center;

        }


        h1 {

            margin-top: 0;

            margin-bottom: 10px;

            font-size: 32px;

            color: #111827;

        }


        .subtitle {

            margin-bottom: 30px;

            color: #6b7280;

            font-size: 16px;

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #ff9900;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 15px;

        }


        button:hover {

            background: #ec8b00;

        }


        #loginStatus {

            margin-top: 12px;

            font-size: 15px;

            color: #374151;

            font-weight: bold;

        }


        #fileInput {

            width: 100%;

            margin-top: 25px;

            padding: 10px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

        }


        #status {

            margin-top: 25px;

            min-height: 40px;

            font-size: 16px;

            font-weight: bold;

            color: #374151;

        }

    </style>

</head>


<body>


    <div class="container">


        <h1>
            AWS CSV Uploader
        </h1>


        <div class="subtitle">

            Upload your CSV files securely to Amazon S3.

        </div>


        <!-- =========================================
             USERNAME
        ========================================== -->

        <button id="loginButton">

            Enter Username

        </button>


        <div id="loginStatus">

            Please enter your username.

        </div>


        <!-- =========================================
             FILE SELECTION
        ========================================== -->

        <input
            type="file"
            id="fileInput"
            accept=".csv,text/csv"
            multiple
        >


        <!-- =========================================
             UPLOAD
        ========================================== -->

        <button id="uploadButton">

            Upload CSV's

        </button>


        <!-- =========================================
             STATUS
        ========================================== -->

        <div id="status"></div>


    </div>


    <!-- =============================================
         JAVASCRIPT
    ============================================== -->

    <script src="script.js"></script>


</body>

</html>
